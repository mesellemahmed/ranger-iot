services:
  ranger:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}

    image: ranger-iot:dev
    working_dir: /workspace

    environment:
      PYTHONPATH: /workspace/src

    volumes:
      - .:/workspace
      - ranger-pip-cache:/home/ranger/.cache/pip

    init: true

volumes:
  ranger-pip-cache: